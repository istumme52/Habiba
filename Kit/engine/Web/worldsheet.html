<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World design review sheet</title>
<style>
  body { margin:0; padding:24px; background:#17212d; color:#f4f0e8; font:16px/1.4 system-ui,sans-serif; }
  h1 { margin:0 0 6px; font-size:22px; }
  p { margin:0 0 18px; color:#c5d0dc; }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  figure { margin:0; padding:8px; background:#263444; border-radius:10px; }
  img { display:block; width:100%; height:auto; aspect-ratio:9/16; object-fit:cover; background:#101820; }
  figcaption { padding:7px 2px 1px; font-weight:600; font-size:13px; }
  #status { color:#f4d18a; }
</style>
</head>
<body>
<h1>World & background design review</h1>
<p>Representative story frames for checking village layout, architecture, terrain, lighting, camera framing and visual continuity. <span id="status">Rendering…</span></p>
<div id="grid"></div>
<script type="module">
import "./main.js";
const grid = document.getElementById("grid");
const status = document.getElementById("status");
const frames = [0, 120, 260, 420, 600, 780, 960, 1100, 1240].filter(f => f < window.TOTAL);
const sourceCanvas = document.querySelector("canvas");
if (sourceCanvas) sourceCanvas.style.display = "none";
for (const frame of frames) {
  const figure = document.createElement("figure");
  const img = document.createElement("img");
  img.alt = "Rendered story frame " + frame;
  img.src = window.renderFrame(frame);
  const caption = document.createElement("figcaption");
  caption.textContent = "Frame " + frame;
  figure.append(img, caption);
  grid.append(figure);
}
await Promise.all([...grid.querySelectorAll("img")].map(img => img.decode()));
status.textContent = frames.length + " views ready";
window.done = true;
</script>
</body>
</html>
