<!doctype html>
<html>
<head><meta charset="utf-8"><title>Character design sheet — 35 presets</title></head>
<body style="margin:0;background:#9fb7d6">
<canvas id="c" width="2400" height="9720"></canvas>
<script type="module">
import * as T from "./toon.js";
import * as C from "./castdefs.js";
const canvas = document.getElementById("c");
const g = canvas.getContext("2d");
const cell = (i, j, draw, label) => {
  g.save();
  g.translate(i * 480 - 60, j * 1080 + 34);
  g.scale(0.8, 0.8);
  draw(new T.Pen(g));
  g.restore();
  g.save();
  g.fillStyle = "#202b3b";
  g.font = "bold 24px sans-serif";
  g.textAlign = "center";
  g.fillText(label, i * 480 + 240, j * 1080 + 1040);
  g.restore();
};
const presets = Object.entries(C).filter(([name, outfit]) =>
  /^(MANJHI_[YMO]|FALGUNI|VIL_\d+|KID)$/.test(name) && outfit && typeof outfit === "object"
);
const L = -Math.PI * 2 / 3;
presets.forEach(([name, outfit], index) => {
  const col = index % 5, row = Math.floor(index / 5);
  const expressions = ["calm", "soft", "stubborn", "worried", "sad"];
  const poses = ["hang", "hip", "point", "belly", "wave"];
  cell(col, row, p => T.bodyFrontX(p, outfit, {
    expr: expressions[index % expressions.length],
    armR: poses[index % poses.length],
    armL: index % 3 === 0 ? "hip" : "hang",
    seed: 13 + index * 7,
    light: L
  }), name);
});
// Motion / profile quality-control row.
const motionTests = [
  ["PROFILE WALK", p => T.bodySideX(p, C.MANJHI_Y, {mode:"walk", phase:0.35, expr:"calm", seed:3, light:L})],
  ["HAMMER RAISE", p => T.bodySideX(p, C.MANJHI_Y, {mode:"hammer", k:0.05, expr:"stubborn", seed:3, light:L})],
  ["HAMMER STRIKE", p => T.bodySideX(p, C.MANJHI_M, {mode:"hammer", k:0.95, expr:"strain", seed:3, light:L})],
  ["WOMAN WALK", p => T.bodySideX(p, C.FALGUNI, {mode:"walk", phase:0.65, pot:true, expr:"calm", seed:5, light:L})],
  ["CHILD WALK", p => T.bodySideX(p, C.KID, {mode:"walk", phase:0.2, expr:"soft", seed:9, light:L})]
];
motionTests.forEach(([name, draw], i) => cell(i, 8, draw, name));
window.done = true;
</script>
</body>
</html>
